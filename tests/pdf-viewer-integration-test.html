<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Viewer Integration Test</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/pdf-viewer.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
    <header>
        <nav>
            <div class="logo">PDF Library - Test</div>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../directory.html">Browse PDFs</a></li>
            </ul>
        </nav>
    </header>

    <main class="pdf-viewer-container" role="main">
        <div class="pdf-controls" role="toolbar" aria-label="PDF viewer controls">
            <div class="control-group" role="group" aria-label="Page navigation">
                <button id="prev-page" class="control-btn" disabled 
                        aria-label="Go to previous page" 
                        title="Previous page (Left arrow or Page Up)">
                    <span aria-hidden="true">‹</span> Previous
                </button>
                <span id="page-info" class="page-info" aria-live="polite">Page 1 of 1</span>
                <button id="next-page" class="control-btn" disabled 
                        aria-label="Go to next page" 
                        title="Next page (Right arrow or Page Down)">
                    Next <span aria-hidden="true">›</span>
                </button>
            </div>
            
            <div class="control-group" role="group" aria-label="Jump to page">
                <label for="page-input" class="sr-only">Page number</label>
                <input type="number" id="page-input" min="1" value="1" 
                       aria-label="Enter page number" 
                       title="Enter page number and press Enter or click Go">
                <button id="go-to-page" class="control-btn" 
                        aria-label="Go to specified page">Go</button>
            </div>
            
            <div class="zoom-controls control-group" role="group" aria-label="Zoom controls">
                <button id="zoom-out" class="control-btn" 
                        aria-label="Zoom out" 
                        title="Zoom out (Ctrl/Cmd + -)">
                    <span aria-hidden="true">−</span>
                </button>
                <span id="zoom-level" aria-live="polite" aria-label="Current zoom level">100%</span>
                <button id="zoom-in" class="control-btn" 
                        aria-label="Zoom in" 
                        title="Zoom in (Ctrl/Cmd + +)">
                    <span aria-hidden="true">+</span>
                </button>
                <button id="fit-width" class="control-btn" 
                        aria-label="Fit to width" 
                        title="Fit PDF to window width">Fit Width</button>
                <button id="fit-height" class="control-btn" 
                        aria-label="Fit to height" 
                        title="Fit PDF to window height">Fit Height</button>
            </div>
            
            <div class="control-group" role="group" aria-label="Document actions">
                <button id="download-pdf" class="control-btn" 
                        aria-label="Download PDF file" 
                        title="Download PDF for offline viewing">
                    <span aria-hidden="true">⬇</span> Download
                </button>
                <button id="back-to-directory" class="control-btn" 
                        aria-label="Return to document directory" 
                        title="Go back to PDF directory">
                    <span aria-hidden="true">←</span> Back to Directory
                </button>
            </div>
        </div>

        <div class="pdf-canvas-container" role="document" aria-label="PDF document viewer">
            <canvas id="pdf-canvas" 
                    role="img" 
                    aria-label="PDF document page"
                    tabindex="0"></canvas>
        </div>

        <div id="loading-indicator" class="loading-indicator" style="display: none;" 
             role="status" aria-live="polite">
            <p>Loading PDF document...</p>
        </div>

        <div id="error-message" class="error-message" style="display: none;" 
             role="alert" aria-live="assertive">
            <p>Error loading PDF. Please try again or download the file.</p>
        </div>
    </main>

    <div id="test-results" style="position: fixed; top: 10px; right: 10px; background: white; padding: 10px; border: 1px solid #ccc; border-radius: 5px; z-index: 1000;">
        <h3>Test Results</h3>
        <div id="test-output"></div>
        <button onclick="runPDFViewerTest()">Run Test</button>
    </div>

    <footer>
        <p>&copy; 2025 PDF Library - Integration Test</p>
    </footer>

    <!-- Scripts -->
    <script>
        // Mock Logger for testing
        class Logger {
            static info(message, data = {}) {
                console.log(`[INFO] ${message}`, data);
            }
            
            static error(message, error = null) {
                console.error(`[ERROR] ${message}`, error);
            }
            
            static debug(message, data = {}) {
                console.debug(`[DEBUG] ${message}`, data);
            }
        }

        // Mock DOM utility
        const DOM = {
            createElement(tag, className = '', textContent = '') {
                const element = document.createElement(tag);
                if (className) element.className = className;
                if (textContent) element.textContent = textContent;
                return element;
            }
        };

        // Mock CONFIG
        const CONFIG = {
            pdfDirectory: '../pdfs/',
            debug: true
        };
    </script>
    <script src="../js/main.js"></script>
    
    <script>
        async function runPDFViewerTest() {
            const output = document.getElementById('test-output');
            output.innerHTML = '<p>Running PDF viewer test...</p>';
            
            try {
                // Test 1: Initialize PDFViewer
                const canvas = document.getElementById('pdf-canvas');
                if (!canvas) {
                    throw new Error('Canvas element not found');
                }
                
                const pdfViewer = new PDFViewer(canvas);
                output.innerHTML += '<p>✓ PDFViewer initialized</p>';
                
                // Test 2: Check if PDF.js is loaded
                if (typeof pdfjsLib === 'undefined') {
                    throw new Error('PDF.js library not loaded');
                }
                output.innerHTML += '<p>✓ PDF.js library loaded</p>';
                
                // Test 3: Test control setup
                setupViewerControls(pdfViewer);
                output.innerHTML += '<p>✓ Viewer controls set up</p>';
                
                // Test 4: Test touch gestures setup
                setupTouchGestures(pdfViewer);
                output.innerHTML += '<p>✓ Touch gestures set up</p>';
                
                // Test 5: Test accessibility functions
                announceToScreenReader('Test announcement');
                output.innerHTML += '<p>✓ Accessibility functions working</p>';
                
                // Test 6: Try to load a sample PDF (this will fail but we can test the error handling)
                try {
                    await pdfViewer.loadPDF('../pdfs/sample-document.pdf');
                    output.innerHTML += '<p>✓ PDF loading attempted</p>';
                } catch (error) {
                    output.innerHTML += '<p>✓ PDF loading error handled gracefully</p>';
                }
                
                output.innerHTML += '<p><strong>All tests passed! PDF viewer is ready.</strong></p>';
                
            } catch (error) {
                output.innerHTML += `<p style="color: red;">✗ Test failed: ${error.message}</p>`;
            }
        }
        
        // Auto-run test when page loads
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(runPDFViewerTest, 1000);
        });
    </script>
</body>
</html>
